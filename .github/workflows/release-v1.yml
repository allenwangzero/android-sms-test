name: Publish verified v1.0.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release-v1.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-v1.0.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '34834333494'
      BUILD_SHA: b6802f111fab2d2cd41c65ab13e0a6147b1a8d89
      ARTIFACT_ID: '10343503196'
    steps:
      - name: Verify successful source build
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg sha "$BUILD_SHA" '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and .path == ".github/workflows/build.yml"' run.json
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" > artifact.json
          jq -e --argjson run "$BUILD_RUN" '.name == "sms-lan-debug-apk" and .expired == false and .workflow_run.id == $run' artifact.json
      - name: Download and verify APK
        run: |
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          echo '72ce465b9e0872865d8c5841ca400fced3ffa8d0ff8ec7309e8f4f6c90168cf7  artifact.zip' | sha256sum --check
          unzip -p artifact.zip app-debug.apk > android-sms-test-v1.0.0.apk
          test -s android-sms-test-v1.0.0.apk
          sha256sum android-sms-test-v1.0.0.apk > SHA256SUMS.txt
      - name: Publish release
        run: |
          if gh release view v1.0.0 --json isDraft > release.json 2>/dev/null; then
            echo 'Release v1.0.0 already exists; leaving it unchanged.'
            exit 0
          fi
          cat > notes.md <<'EOF'
          安卓短信局域网测试工具第一版。

          下载 android-sms-test-v1.0.0.apk 安装到 Android 8.0 或更新版本的测试机。无需 root。

          电脑启动本地服务，手机扫码连接；在电脑生成和编辑短信，手机确认后写入系统收件箱。

          这是测试用 debug APK。写入前需临时设为默认短信应用，完成后恢复原应用；不模拟运营商来信广播。真机兼容性仍需按 README 验收。

          APK 来自通过编译、lint 和桌面端测试的构建：
          https://github.com/allenwangzero/android-sms-test/actions/runs/34834333494
          EOF
          gh release create v1.0.0 android-sms-test-v1.0.0.apk SHA256SUMS.txt --target "$BUILD_SHA" --title '短信测试工具 v1.0.0' --notes-file notes.md
