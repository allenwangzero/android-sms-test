name: Test and build SMS tool

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r desktop/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: node --check desktop/static/app.js
      - run: npm install --prefix "$RUNNER_TEMP/sms-tests" --ignore-scripts --no-audit --no-fund fake-indexeddb@6.2.5 jsdom@26.1.0
      - run: node scripts/test-pending-storage.cjs "$RUNNER_TEMP/sms-tests/node_modules/fake-indexeddb"
      - run: node scripts/test-xml-import.cjs "$RUNNER_TEMP/sms-tests/node_modules/jsdom"
  docker:
    runs-on: ubuntu-latest
    env:
      SMS_ADVERTISE_HOST: 192.168.1.20
      SMS_PORT: '18876'
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p sms-ci up -d --build --wait --wait-timeout 60
      - name: Test server inside Docker image
        run: docker compose -p sms-ci run --rm --no-deps --entrypoint python -v "$PWD/tests:/app/tests:ro" desktop -m unittest discover -s tests -p 'test_*.py' -v
      - name: Clean up test containers and data
        if: always()
        run: docker compose -p sms-ci down -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - run: sh scripts/test.sh
      - run: chmod +x gradlew && ./gradlew :app:assembleDebug :app:lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: sms-lan-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
