name: Publish verified v1.2.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release-v1.2.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-v1.2.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '34922973482'
      BUILD_SHA: f4c3a902d1172dcf685753d27473f73529598580
      ARTIFACT_ID: '10378213642'
    steps:
      - name: Verify successful source build
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg sha "$BUILD_SHA" '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and .path == ".github/workflows/build.yml"' run.json
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" > artifact.json
          jq -e --argjson run "$BUILD_RUN" '.name == "sms-lan-debug-apk" and .expired == false and .workflow_run.id == $run' artifact.json
      - name: Download and verify APK
        run: |
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          echo '339c27b40233ae0f6b750aa9218a93d871812487670f3a60f3cc051c2a11c01d  artifact.zip' | sha256sum --check
          unzip -p artifact.zip app-debug.apk > android-sms-test-v1.2.0.apk
          test -s android-sms-test-v1.2.0.apk
          sha256sum android-sms-test-v1.2.0.apk > SHA256SUMS.txt
      - name: Publish release
        run: |
          if gh release view v1.2.0 --json isDraft > release.json 2>/dev/null; then
            echo 'Release v1.2.0 already exists; leaving it unchanged.'
            exit 0
          fi
          cat > notes.md <<'EOF'
          安卓短信局域网测试工具：XML 元数据写入与预览。

          下载 android-sms-test-v1.2.0.apk 安装到 Android 8.0 或更新版本的测试机。无需 root。

          电脑一次生成完整列表，自动按每批 500 条传输，单任务最多 100,000 条。手机确认一次后依次导入，显示总进度；失败或退出前台后停止，不自动重试已写入短信。

          请同时更新电脑端和 APK。电脑端支持 Docker：更新源码后执行 docker compose up -d --build。

          XML 的 protocol、type、subject、service_center、read、status、locked 会保留并写入标准短信字段，电脑与手机预览展示 read/status/locked 的中文含义和数值。仅支持 type=1 收件短信；toa/sc_toa 没有 Android 标准列，仅接受空值，非空明确拒绝。

          本版使用协议 3，必须同步更新电脑端与 APK。已通过服务端、浏览器、元数据解析及写入字段映射测试，尚未完成各型号真机验收。旧版若提示签名冲突，需结束当前任务后卸载旧工具再安装。

          这是测试用 debug APK。写入前需临时设为默认短信应用，完成后恢复原应用；不模拟运营商来信广播。真机兼容性仍需按 README 验收。

          APK 来自通过编译、lint 和桌面端测试的构建：
          https://github.com/allenwangzero/android-sms-test/actions/runs/34922973482
          EOF
          gh release create v1.2.0 android-sms-test-v1.2.0.apk SHA256SUMS.txt --target "$BUILD_SHA" --title '短信测试工具 v1.2.0' --notes-file notes.md
