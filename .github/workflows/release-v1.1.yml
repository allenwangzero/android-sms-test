name: Publish verified v1.1.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release-v1.1.yml]

permissions:
  actions: read
  contents: write

concurrency:
  group: publish-v1.1.0
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BUILD_RUN: '34921402857'
      BUILD_SHA: 833c1781f5e76a574af4a0adaf832ea4e0ccd3b7
      ARTIFACT_ID: '10378835142'
    steps:
      - name: Verify successful source build
        run: |
          gh api "repos/$GH_REPO/actions/runs/$BUILD_RUN" > run.json
          jq -e --arg sha "$BUILD_SHA" '.conclusion == "success" and .head_sha == $sha and .head_branch == "main" and .path == ".github/workflows/build.yml"' run.json
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID" > artifact.json
          jq -e --argjson run "$BUILD_RUN" '.name == "sms-lan-debug-apk" and .expired == false and .workflow_run.id == $run' artifact.json
      - name: Download and verify APK
        run: |
          gh api "repos/$GH_REPO/actions/artifacts/$ARTIFACT_ID/zip" > artifact.zip
          echo 'aba0f95223b041dd132de5b3fde47b1f3e9361dc0e3689c7d356e24839d67b01  artifact.zip' | sha256sum --check
          unzip -p artifact.zip app-debug.apk > android-sms-test-v1.1.0.apk
          test -s android-sms-test-v1.1.0.apk
          sha256sum android-sms-test-v1.1.0.apk > SHA256SUMS.txt
      - name: Publish release
        run: |
          if gh release view v1.1.0 --json isDraft > release.json 2>/dev/null; then
            echo 'Release v1.1.0 already exists; leaving it unchanged.'
            exit 0
          fi
          cat > notes.md <<'EOF'
          安卓短信局域网测试工具：自动分批导入。

          下载 android-sms-test-v1.1.0.apk 安装到 Android 8.0 或更新版本的测试机。无需 root。

          电脑一次生成完整列表，自动按每批 500 条传输，单任务最多 100,000 条。手机确认一次后依次导入，显示总进度；失败或退出前台后停止，不自动重试已写入短信。

          请同时更新电脑端和 APK。电脑端支持 Docker：更新源码后执行 docker compose up -d --build。

          已通过自动化测试和 12,345 条模拟设备联调，尚未完成各型号真机验收。旧版若提示签名冲突，需结束当前任务后卸载旧工具再安装。

          这是测试用 debug APK。写入前需临时设为默认短信应用，完成后恢复原应用；不模拟运营商来信广播。真机兼容性仍需按 README 验收。

          APK 来自通过编译、lint 和桌面端测试的构建：
          https://github.com/allenwangzero/android-sms-test/actions/runs/34921402857
          EOF
          gh release create v1.1.0 android-sms-test-v1.1.0.apk SHA256SUMS.txt --target "$BUILD_SHA" --title '短信测试工具 v1.1.0' --notes-file notes.md
